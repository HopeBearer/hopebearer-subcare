name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Set up Docker Buildx for better caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Web with layer caching
      # Note: NEXT_PUBLIC_* vars must be passed as build-args (they're embedded at build time)
      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            NEXT_PUBLIC_SOCKET_URL=

      # Build API with layer caching
      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Copy config files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,docker/nginx/nginx.conf"
          target: "/home/${{ secrets.VPS_USER }}/subcare"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          GITHUB_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          FIXER_API_KEY: ${{ secrets.FIXER_API_KEY }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_IMAGE_NAME,MYSQL_ROOT_PASSWORD,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,EMAIL_FROM,FIXER_API_KEY,CORS_ORIGIN,GHCR_TOKEN
          script: |
            cd /home/${{ secrets.VPS_USER }}/subcare
            
            # Create/update .env file (persists environment variables)
            cat > .env << ENVEOF
            GITHUB_IMAGE_NAME=${GITHUB_IMAGE_NAME}
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_SECURE=${SMTP_SECURE}
            SMTP_USER=${SMTP_USER}
            SMTP_PASS=${SMTP_PASS}
            EMAIL_FROM="${EMAIL_FROM}"
            FIXER_API_KEY=${FIXER_API_KEY}
            CORS_ORIGIN=${CORS_ORIGIN}
            ENVEOF
            # Remove leading whitespace from .env
            sed -i 's/^[[:space:]]*//' .env
            
            # Login to GHCR
            echo ${GHCR_TOKEN} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Rolling update: pull new images and restart containers
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Prune old images to save disk space
            docker image prune -f
            
            # Health check: wait for API to be ready (max 120s)
            # The entrypoint script runs schema sync + all seed scripts before starting
            echo "⏳ Waiting for API to be healthy..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:80/api/health > /dev/null 2>&1; then
                echo "✅ API is healthy!"
                break
              fi
              echo "  Waiting... ($((i*5))s/120s)"
              sleep 5
            done
            
            # Final status check
            docker compose ps
            echo "🎉 Deployment complete!"
